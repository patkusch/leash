name: leash
description: Check coding-agent permission and MCP files for saved secrets, wide-open rules, and secrets left in git history.
author: patkusch
branding:
  icon: lock
  color: orange

inputs:
  path:
    description: Folder to check, relative to the repo.
    default: "."
  fail-on:
    description: "Which findings fail the step: critical, high or never."
    default: critical
  sarif-file:
    description: "Also write SARIF to this path, for github/codeql-action/upload-sarif. Empty means no SARIF."
    default: ""
  baseline:
    description: "A baseline file made with `leash --write-baseline`. Findings in it are hidden, so only new ones fail."
    default: ""

outputs:
  sarif-file:
    description: The SARIF file written, if any.
    value: ${{ inputs.sarif-file }}

runs:
  using: composite
  steps:
    - name: Run leash
      shell: bash
      env:
        LEASH_PATH: ${{ inputs.path }}
        LEASH_FAIL_ON: ${{ inputs.fail-on }}
        LEASH_SARIF: ${{ inputs.sarif-file }}
        LEASH_BASELINE: ${{ inputs.baseline }}
        LEASH_SRC: ${{ github.action_path }}/src
      run: |
        extra=()
        if [ -n "$LEASH_BASELINE" ]; then extra+=(--baseline "$LEASH_BASELINE"); fi
        if [ -n "$LEASH_SARIF" ]; then
          PYTHONPATH="$LEASH_SRC" python3 -m leash "$LEASH_PATH" --no-user --no-gh --sarif --fail-on never "${extra[@]}" > "$LEASH_SARIF"
        fi
        report="$(mktemp)"
        set +e
        PYTHONPATH="$LEASH_SRC" python3 -m leash "$LEASH_PATH" --no-user --no-gh --all --fail-on "$LEASH_FAIL_ON" "${extra[@]}" > "$report"
        code=$?
        set -e
        cat "$report"
        PYTHONPATH="$LEASH_SRC" python3 -m leash "$LEASH_PATH" --no-user --no-gh --markdown --fail-on never "${extra[@]}" >> "$GITHUB_STEP_SUMMARY"
        exit $code
