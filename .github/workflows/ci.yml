name: tests
on: [push, pull_request]
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: PYTHONPATH=src:tests python -m unittest discover -s tests
      - name: leash must find the two planted secrets in the example and nothing in a clean folder
        run: |
          PYTHONPATH=src python -m leash docs/example --no-user --no-gh --json > /tmp/example.json || true
          python -c "import json; d=json.load(open('/tmp/example.json')); assert d['summary']['critical'] >= 2, d['summary']"
          mkdir -p /tmp/clean && PYTHONPATH=src python -m leash /tmp/clean --no-user --no-gh

  action:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: The action reports the planted example without failing
        uses: ./
        with:
          path: docs/example
          fail-on: never
      - name: The action passes on the repo itself (the example is in .leashignore)
        uses: ./
        with:
          path: .
          fail-on: high
