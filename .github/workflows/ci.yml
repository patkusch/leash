name: tests
on: [push, pull_request]
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: PYTHONPATH=src:tests python -m unittest discover -s tests
      - name: leash must find the two planted secrets in the example and nothing in a clean folder
        run: |
          PYTHONPATH=src python -m leash docs/example --no-user --no-gh --json > /tmp/example.json || true
          python -c "import json; d=json.load(open('/tmp/example.json')); assert d['summary']['critical'] >= 2, d['summary']"
          mkdir -p /tmp/clean && PYTHONPATH=src python -m leash /tmp/clean --no-user --no-gh

  action:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: The action reports the planted example without failing
        uses: ./
        with:
          path: docs/example
          fail-on: never
      - name: The action writes SARIF that names the planted secrets
        uses: ./
        with:
          path: docs/example
          fail-on: never
          sarif-file: leash.sarif
      - run: |
          python3 -c "
          import json; d = json.load(open('leash.sarif'))
          r = d['runs'][0]['results']
          assert d['version'] == '2.1.0' and any(x['ruleId'] == 'leash/secret/critical' for x in r), r
          assert all(x['locations'][0]['physicalLocation']['artifactLocation']['uri'].startswith('docs/example/') for x in r)
          print(len(r), 'results')"
      - name: The action passes on the repo itself (the example is in .leashignore)
        uses: ./
        with:
          path: .
          fail-on: high
